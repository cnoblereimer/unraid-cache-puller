<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cache Puller</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.svg" alt="" width="28" height="28">
      <div>
        <h1>Cache Puller</h1>
        <div class="sub" id="run-info">Loading…</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="badge" id="mode-badge">…</span>
      <button class="btn primary" id="run-now" type="button">Run now</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" class="active">Overview</button>
    <button role="tab" data-tab="files">Files</button>
    <button role="tab" data-tab="activity">Activity</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>

  <main>
    <section id="tab-overview" class="tab active"></section>
    <section id="tab-files" class="tab">
      <div class="toolbar filters">
        <input type="search" id="file-search" placeholder="Search files…" aria-label="Search files">
        <select id="f-share" aria-label="Share"><option value="">All shares</option></select>
        <select id="f-status" aria-label="Status">
          <option value="">Any status</option>
          <option value="pool">On cache</option>
          <option value="candidate">Will move</option>
          <option value="cold">On array</option>
          <option value="blocked">Won't move</option>
          <option value="missing">Gone</option>
          <option value="unmanaged">Not managed</option>
        </select>
        <select id="f-where" aria-label="Where"><option value="">Anywhere</option></select>
        <select id="f-since" aria-label="Last used">
          <option value="">Used any time</option>
          <option value="3600">Used in the last hour</option>
          <option value="86400">Used in the last 24 hours</option>
          <option value="604800">Used in the last 7 days</option>
          <option value="2592000">Used in the last 30 days</option>
        </select>
        <select id="f-sort" class="show-sm" aria-label="Sort by">
          <option value="score:desc">Sort: highest score</option>
          <option value="hits:desc">Sort: most accesses</option>
          <option value="last_access:desc">Sort: recently used</option>
          <option value="last_access:asc">Sort: least recently used</option>
          <option value="size:desc">Sort: largest</option>
          <option value="path:asc">Sort: name A–Z</option>
        </select>
        <label class="check"><input type="checkbox" id="hot-only"> Only frequently used</label>
        <button class="btn small link" type="button" id="f-clear" hidden>Clear filters</button>
      </div>
      <p class="hint" id="files-hint"></p>
      <div class="cleanup-bar" id="cleanup-bar"></div>
      <div class="table-wrap"><table class="data stack" id="files-table"></table></div>
      <div class="pager" id="files-pager"></div>
    </section>
    <section id="tab-activity" class="tab">
      <p class="hint">Every move this app made or skipped, newest first.</p>
      <div class="table-wrap"><table class="data stack" id="activity-table"></table></div>
    </section>
    <section id="tab-settings" class="tab">
      <form id="settings-form" autocomplete="off"></form>
    </section>
  </main>

  <div class="savebar" id="savebar" hidden>
    <span id="savebar-text">Unsaved changes</span>
    <div>
      <button class="btn" type="button" id="discard">Discard</button>
      <button class="btn primary" type="button" id="save">Save changes</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
